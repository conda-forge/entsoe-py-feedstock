schema_version: 1

context:
  name: entsoe-py
  version: "1.0.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/entsoe_py-${{ version }}.tar.gz
  sha256: 5358851db11985f68123e73ebcdbab82a417eff4a1732a109a9c8b1298d533ac

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests
    - pytz
    - pandas >=2.2.0
    - beautifulsoup4 >=4.11.1

tests:
  - python:
      imports:
        - entsoe
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Python client for the ENTSO-E API (european network of transmission system operators for electricity)
  homepage: https://github.com/EnergieID/entsoe-py
  repository: https://github.com/EnergieID/entsoe-py

extra:
  recipe-maintainers:
    - FabianHofmann
    - xylar
