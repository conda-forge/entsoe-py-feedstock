{% set name = "entsoe-py" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/entsoe_py-{{ version }}.tar.gz
  sha256: 4c956fc655f7c0c93941ac8577816bc45a31b42d587772b3efceb3fd705cbf84

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - requests
    - pytz
    - beautifulsoup4 >=4.11.1
    - pandas >=2.2.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - entsoe
  commands:
    - pip check

about:
  home: https://github.com/EnergieID/entsoe-py
  license: MIT
  license_file: LICENSE
  summary: Python client for the ENTSO-E API (european network of transmission system operators for electricity)
  dev_url: https://github.com/EnergieID/entsoe-py

extra:
  recipe-maintainers:
    - FabianHofmann
    - xylar
